<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Engine</title>
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --ink: #1c1c1a; --muted: #6d6c66; --line: #e4e3de;
  --accent: #2f5bea; --ok: #1f8a4c; --warn: #b7791f; --bad: #c53030; --run: #2f5bea; --chip: #efeee9;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe6; --muted: #9b9a93; --line: #31312e;
          --accent: #7d9bff; --ok: #4cc283; --warn: #e0a84a; --bad: #f06b6b; --run: #7d9bff; --chip: #2a2a27; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
header .sub { color: var(--muted); }
.pill { padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--chip); }
.pill.ok { color: var(--ok); } .pill.bad { color: var(--bad); } .pill.warn { color: var(--warn); } .pill.run { color: var(--run); }
.spacer { flex: 1; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; }
button.danger { background: var(--bad); color: #fff; border-color: var(--bad); font-weight: 600; }
button.small { padding: 2px 8px; font-size: 12px; }
main { display: grid; grid-template-columns: 380px 1fr; gap: 20px; padding: 20px; max-width: 1500px; margin: 0 auto; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.phone { position: sticky; top: 76px; align-self: start; }
.screen { position: relative; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 720/1612; width: 100%; max-width: 350px; margin: 0 auto; touch-action: none; }
.screen canvas, .screen img { width: 100%; height: 100%; display: block; object-fit: contain; }
.screen .veil { position: absolute; inset: auto 0 0 0; padding: 8px; text-align: center; font-size: 12px; color: #fff; background: rgba(0,0,0,.55); }
.screen .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 13px; padding: 20px; text-align: center; }
.keys { display: flex; gap: 6px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.typer { display: flex; gap: 6px; margin-top: 8px; }
.typer input { flex: 1; font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { border: none; background: none; padding: 6px 12px; border-radius: 8px; color: var(--muted); }
.tabs button.on { background: var(--chip); color: var(--ink); font-weight: 600; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.st { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--chip); white-space: nowrap; }
.st.done { color: var(--ok); } .st.failed, .st.unverified { color: var(--bad); } .st.running { color: var(--run); }
.st.waiting { color: var(--muted); } .st.skipped { color: var(--warn); }
.muted { color: var(--muted); }
.err { color: var(--bad); font-size: 12px; }
.tail { font: 12px/1.4 ui-monospace, Menlo, monospace; background: var(--bg); border-radius: 8px; padding: 10px; max-height: 220px; overflow: auto; white-space: pre-wrap; margin-top: 8px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { background: var(--chip); border-radius: 10px; padding: 8px 12px; font-size: 12px; }
.chip b { font-size: 13px; }
.row-actions { white-space: nowrap; }
.row-actions button { margin-left: 4px; }
.cap { max-width: 340px; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); width: min(900px, 94vw); padding: 0; }
dialog pre { margin: 0; padding: 16px; max-height: 70vh; overflow: auto; font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
dialog .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.scroll-x { overflow-x: auto; }
.empty { color: var(--muted); padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Content Engine</h1><span class="sub">noswipe</span>
  <span id="status" class="pill">…</span>
  <span id="phone" class="pill">phone …</span>
  <span class="spacer"></span>
  <button id="takeBtn" class="danger">Take over</button>
</header>

<main>
  <section class="card phone">
    <div class="screen" id="screen">
      <canvas id="cv" width="720" height="1612"></canvas>
      <div class="msg" id="screenMsg">connecting to the phone…</div>
      <div class="veil" id="veil">View only. Take over to control the phone.</div>
    </div>
    <div class="keys">
      <button data-key="back">◀ Back</button>
      <button data-key="home">● Home</button>
      <button data-key="recents">■ Apps</button>
      <button data-key="wake">☀ Wake</button>
      <button data-key="power">⏻</button>
    </div>
    <form class="typer" id="typer">
      <input id="typeIn" placeholder="type text on the phone" autocomplete="off">
      <button>Send</button>
    </form>
  </section>

  <section>
    <div class="tabs" id="tabs">
      <button data-tab="today" class="on">Today</button>
      <button data-tab="results">Post stats</button>
      <button data-tab="research">Research</button>
      <button data-tab="alerts">Alerts <span id="alertCount"></span></button>
    </div>
    <div id="view-today">
      <div class="chips" id="accounts"></div>
      <div class="card" id="runningCard" style="margin-bottom:14px; display:none"></div>
      <div class="card scroll-x"><table id="jobs"></table></div>
    </div>
    <div id="view-results" hidden><div class="card scroll-x" id="results"></div></div>
    <div id="view-research" hidden><div class="card scroll-x" id="research"></div></div>
    <div id="view-alerts" hidden><div class="card" id="alerts"></div></div>
  </section>
</main>

<dialog id="logDlg"><div class="bar"><b id="logTitle">Log</b><button onclick="logDlg.close()">Close</button></div><pre id="logText"></pre></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hm = t => t ? new Date(t * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : "";
const dayhm = t => t ? new Date(t * 1000).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "";
const post = (u, b) => fetch(u, {method: "POST", headers: {"Content-Type": "application/json"}, body: b ? JSON.stringify(b) : null}).then(r => r.json());
let S = null;

// ---------------------------------------------------------------- tabs
$("#tabs").onclick = e => {
  const t = e.target.closest("button")?.dataset.tab; if (!t) return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  for (const v of ["today", "results", "research", "alerts"]) $("#view-" + v).hidden = v !== t;
  if (t === "results" || t === "research") loadResults();
  if (t === "alerts") post("/api/alerts/seen");
};

// ---------------------------------------------------------------- state
const KIND = {post: "Post", stats: "Stats", research: "Research", delete: "Delete", preflight: "Preflight"};
function what(j) {
  const a = j.args || {};
  if (j.kind === "post") return `<b>${esc(j.label)}</b> <span class="muted cap">${esc((a.caption||"").slice(0, 60))}</span>` +
      `<span class="muted"> · ${esc(a.visibility || a.audience)}</span>`;
  if (j.kind === "stats") return `${esc(j.label)} snapshot · <span class="muted">${esc((a.caption||"").slice(0, 50))}</span>`;
  if (j.kind === "research") return `“${esc(a.keyword)}” · ${a.minutes} min` + (j.not_after ? ` <span class="muted">until ${hm(j.not_after)}</span>` : "");
  if (j.kind === "delete") return `delete <span class="muted">${esc((a.caption||"").slice(0, 50))}</span>`;
  if (j.kind === "preflight") return `morning checks: phone, accounts, disks, render server, today's plan`;
  return "";
}
function render() {
  const st = $("#status");
  if (S.paused) { st.textContent = S.pausing ? "Taking over… (finishing current job)" : "Taken over: you have the phone"; st.className = "pill warn"; }
  else if (S.running) { st.textContent = `Running: ${KIND[S.running.kind]} ${S.running.app}`; st.className = "pill run"; }
  else { st.textContent = "Idle: waiting for the next job"; st.className = "pill ok"; }
  const ph = $("#phone");
  ph.textContent = S.phone_ok === false ? "phone offline" : S.phone_ok ? "phone connected" : "phone …";
  ph.className = "pill " + (S.phone_ok === false ? "bad" : S.phone_ok ? "ok" : "");
  const tb = $("#takeBtn");
  tb.textContent = S.paused ? "Resume automation" : "Take over";
  tb.className = S.paused ? "primary" : "danger";
  $("#veil").style.display = S.paused ? "none" : "";

  $("#accounts").innerHTML = S.accounts.map(a => `<div class="chip"><b>${a.app === "tiktok" ? "TikTok" : "Instagram"} @${esc(a.account)}</b><br>
    posts ${a.used.posts}/${a.limits.posts_per_day ?? "–"} · likes ${a.used.likes}/${a.limits.likes_per_day ?? "–"} ·
    comments ${a.used.comments}/${a.limits.comments_per_day ?? "–"} · research ${Math.round(a.used.research_minutes)}/${a.limits.research_minutes_per_day ?? "–"} min</div>`).join("");

  const rc = $("#runningCard");
  if (S.running) {
    rc.style.display = "";
    rc.innerHTML = `<b>Now:</b> ${KIND[S.running.kind]} · ${esc(S.running.app)} @${esc(S.running.account)} · started ${hm(S.running.started_at)}
      <div class="tail" id="tail">${esc(S.tail.join("\n"))}</div>`;
    const t = $("#tail"); t.scrollTop = t.scrollHeight;
  } else rc.style.display = "none";

  const now = S.now;
  $("#jobs").innerHTML = `<tr><th>Time</th><th>Job</th><th>Account</th><th>What</th><th>Status</th><th></th></tr>` +
    (S.jobs.length ? S.jobs.map(j => {
      const t = j.status === "waiting" ? j.run_at : (j.started_at || j.run_at);
      const late = j.status === "waiting" && j.run_at < now - 120 && j.kind !== "research";
      return `<tr>
        <td>${dayhm(t)}${late ? ' <span class="err">late</span>' : ""}</td>
        <td>${KIND[j.kind] || j.kind}</td>
        <td>${j.app === "-" ? "—" : (j.app === "tiktok" ? "TikTok" : "IG") + " @" + esc(j.account)}</td>
        <td>${what(j)}${j.error ? `<div class="err">${esc(j.error)}</div>` : ""}${j.shot ? ` <a href="/shots/${esc(j.shot)}" target="_blank">screenshot</a>` : ""}</td>
        <td><span class="st ${j.status}">${j.status}</span>${j.attempts > 1 ? ` <span class="muted">×${j.attempts}</span>` : ""}</td>
        <td class="row-actions">
          ${j.started_at ? `<button class="small" onclick="showLog(${j.id})">log</button>` : ""}
          ${["failed","skipped","unverified"].includes(j.status) ? `<button class="small" onclick="act(${j.id},'retry')">retry</button>` : ""}
          ${j.status === "waiting" ? `<button class="small" onclick="act(${j.id},'now')">run now</button><button class="small" onclick="act(${j.id},'skip')">skip</button>` : ""}
        </td></tr>`;
    }).join("") : `<tr><td colspan="6" class="empty">No jobs. Drop a plan in mailbox/inbox/&lt;name&gt;/plan.json</td></tr>`);

  const unseen = S.alerts.filter(a => !a.seen).length;
  $("#alertCount").textContent = unseen ? `(${unseen})` : "";
  $("#alerts").innerHTML = S.alerts.length ? `<table><tr><th>When</th><th>Kind</th><th>What</th><th>Emailed</th></tr>` +
    S.alerts.map(a => `<tr><td>${dayhm(a.at)}</td><td>${esc(a.kind)}</td><td>${esc(a.text)}</td><td>${a.emailed ? "yes" : "no"}</td></tr>`).join("") + `</table>`
    : `<div class="empty">No alerts.</div>`;
}
async function poll() {
  try { S = await fetch("/api/state").then(r => r.json()); render(); } catch (e) { $("#status").textContent = "engine not reachable"; $("#status").className = "pill bad"; }
}
setInterval(poll, 2000); poll();
window.act = async (id, a) => { await post(`/api/job/${id}/${a}`); poll(); };
window.showLog = async id => { $("#logTitle").textContent = `Job ${id} log`; $("#logText").textContent = await fetch(`/api/job/${id}/log`).then(r => r.text()); logDlg.showModal(); };
$("#takeBtn").onclick = async () => { await post(S && S.paused ? "/api/resume" : "/api/takeover"); poll(); };

// ---------------------------------------------------------------- results
const n = v => v == null ? "–" : Number(v).toLocaleString();
async function loadResults() {
  const R = await fetch("/api/results").then(r => r.json());
  $("#results").innerHTML = R.posts.length ? R.posts.map(p => {
    const snaps = p.snapshots;
    const tt = p.app === "tiktok";
    const rowsHtml = snaps.map(s => {
      const d = s.data, L = d.live || d, D = d.detailed || {};
      return tt ? `<tr><td>${esc(s.label)}</td><td class="num">${n(L.views)}</td><td class="num">${n(L.likes)}</td><td class="num">${n(L.comments)}</td>
          <td class="num">${n(L.saves)}</td><td class="num">${n(L.shares)}</td><td class="num">${D.average_watch_time_s ?? "–"}${D.average_watch_time_s != null ? "s" : ""}</td>
          <td class="num">${D.watched_full_video_pct ?? "–"}${D.watched_full_video_pct != null ? "%" : ""}</td></tr>`
        : `<tr><td>${esc(s.label)}</td><td class="num">${n(d.views)}</td><td class="num">${n(d.viewers)}</td><td class="num">${d.average_watch_time_s ?? "–"}${d.average_watch_time_s != null ? "s" : ""}</td>
          <td class="num">${d.skip_rate_pct ?? "–"}${d.skip_rate_pct != null ? "%" : ""}</td><td class="num">${d.like_rate_pct ?? "–"}</td><td class="num">${d.share_rate_pct ?? "–"}</td><td class="num">${n(d.follows)}</td></tr>`;
    }).join("");
    const head = tt ? `<tr><th>At</th><th class="num">Views</th><th class="num">Likes</th><th class="num">Comments</th><th class="num">Saves</th><th class="num">Shares</th><th class="num">Avg watch</th><th class="num">Full watch</th></tr>`
                    : `<tr><th>At</th><th class="num">Views</th><th class="num">Viewers</th><th class="num">Avg watch</th><th class="num">Skip rate</th><th class="num">Like %</th><th class="num">Share %</th><th class="num">Follows</th></tr>`;
    return `<div style="margin-bottom:22px"><b>${esc(p.label)}</b> · ${tt ? "TikTok" : "Instagram"} @${esc(p.account)} · posted ${dayhm(p.posted_at)}
      ${p.status === "unverified" ? '<span class="st unverified">unverified</span>' : ""}
      <div class="muted">${esc(p.caption)}</div>
      ${snaps.length ? `<table>${head}${rowsHtml}</table>` : `<div class="muted">no snapshots yet</div>`}</div>`;
  }).join("") : `<div class="empty">No posts yet.</div>`;
  $("#research").innerHTML = R.research.length ? `<table><tr><th>Seen</th><th>App</th><th>Keyword</th><th>Creator</th><th>Caption</th><th class="num">Likes</th><th class="num">Comments</th><th>We</th></tr>` +
    R.research.map(v => `<tr><td>${esc(v.seen_at.slice(5, 16))}</td><td>${v.app === "tiktok" ? "TT" : "IG"}</td><td>${esc(v.keyword)}</td><td>${esc(v.creator)}</td>
      <td class="cap">${esc((v.caption || "").slice(0, 90))}</td><td class="num">${n(v.likes)}</td><td class="num">${n(v.comments)}</td>
      <td>${v.liked ? "liked " : ""}${v.commented ? `commented: <i>${esc(v.commented)}</i>` : ""}</td></tr>`).join("") + `</table>`
    : `<div class="empty">No research yet.</div>`;
}

// ---------------------------------------------------------------- live screen (scrcpy -> WebCodecs)
const cv = $("#cv"), ctx = cv.getContext("2d"), msg = $("#screenMsg");
let W = 720, H = 1612, ws = null, useFallback = !("VideoDecoder" in window);
const hex = b => b.toString(16).padStart(2, "0");
function codecFromSps(cfg) {
  for (let i = 0; i + 4 < cfg.length; i++) {
    if (cfg[i] === 0 && cfg[i+1] === 0 && cfg[i+2] === 1 && (cfg[i+3] & 0x1f) === 7) return "avc1." + hex(cfg[i+4]) + hex(cfg[i+5]) + hex(cfg[i+6]);
  }
  return "avc1.42e01e";
}
// fell behind: ask the phone for a fresh key frame instead of waiting for the next scheduled one
const askKey = () => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({t: "keyframe"})); };
function startStream() {
  let dec = null, cfg = null, gotKey = false;
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/screen");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { msg.textContent = "waiting for video…"; };
  ws.onmessage = ev => {
    if (typeof ev.data === "string") { const m = JSON.parse(ev.data); if (m.error) msg.textContent = "screen: " + m.error; return; }
    const u = new Uint8Array(ev.data), t = u[0];
    if (t === 1) { const dv = new DataView(ev.data); W = dv.getUint32(1); H = dv.getUint32(5); cv.width = W; cv.height = H; }
    else if (t === 2) {
      cfg = u.slice(1); gotKey = false;
      if (dec) try { dec.close(); } catch (e) {}
      dec = new VideoDecoder({
        output: f => { ctx.drawImage(f, 0, 0, W, H); f.close(); msg.style.display = "none"; },
        error: e => { console.warn(e); gotKey = false; askKey(); },
      });
      dec.configure({codec: codecFromSps(cfg), optimizeForLatency: true});
    } else if (t === 3 && dec && dec.state === "configured") {
      const key = u[1] === 1;
      if (!gotKey && !key) return;
      if (dec.decodeQueueSize > 3 && !key) { gotKey = false; askKey(); return; }
      let data = u.subarray(2);
      if (key) { const d = new Uint8Array(cfg.length + data.length); d.set(cfg); d.set(data, cfg.length); data = d; gotKey = true; }
      dec.decode(new EncodedVideoChunk({type: key ? "key" : "delta", timestamp: performance.now() * 1000, data}));
    }
  };
  ws.onclose = () => { msg.style.display = ""; msg.textContent = "screen disconnected, reconnecting…"; setTimeout(startStream, 3000); };
}
// fallback: screenshots (browsers without WebCodecs, e.g. plain http on another device; use https via tailscale serve)
let img = null;
function startFallback() {
  img = document.createElement("img"); cv.replaceWith(img); img.id = "cv";
  msg.textContent = "low-frame-rate mode (no WebCodecs here: open the dashboard over https)";
  const tick = () => { const i = new Image(); i.onload = () => { img.src = i.src; msg.style.display = "none"; setTimeout(tick, 500); };
                       i.onerror = () => setTimeout(tick, 2000); i.src = "/api/screen.png?" + Date.now(); };
  tick();
}
if (useFallback) startFallback(); else startStream();

// input
const surface = () => $("#cv");
function toPhone(e) {
  const r = surface().getBoundingClientRect();
  return {x: Math.round((e.clientX - r.left) / r.width * W), y: Math.round((e.clientY - r.top) / r.height * H)};
}
let down = null, lastMove = 0;
const send = m => { if (!S || !S.paused) return; if (useFallback) return; if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
const scr = $("#screen");
scr.addEventListener("pointerdown", e => {
  if (!S || !S.paused) return;
  scr.setPointerCapture(e.pointerId); down = toPhone(e);
  send({t: "touch", a: 0, ...down});
});
scr.addEventListener("pointermove", e => {
  if (!down) return; const now = performance.now(); if (now - lastMove < 16) return; lastMove = now;
  send({t: "touch", a: 2, ...toPhone(e)});
});
scr.addEventListener("pointerup", e => {
  if (!down) return; const p = toPhone(e);
  if (useFallback) {
    const moved = Math.hypot(p.x - down.x, p.y - down.y) > 20;
    post("/api/input", moved ? {t: "swipe", x1: down.x, y1: down.y, x2: p.x, y2: p.y} : {t: "tap", ...p});
  } else send({t: "touch", a: 1, ...p});
  down = null;
});
document.querySelectorAll("[data-key]").forEach(b => b.onclick = () => {
  if (!S || !S.paused) { alertTake(); return; }
  useFallback ? post("/api/input", {t: "key", k: b.dataset.key}) : send({t: "key", k: b.dataset.key});
});
$("#typer").onsubmit = e => {
  e.preventDefault(); if (!S || !S.paused) { alertTake(); return; }
  const s = $("#typeIn").value; if (!s) return; send({t: "text", s}); $("#typeIn").value = "";
};
function alertTake() { const v = $("#veil"); v.textContent = "Press “Take over” first."; setTimeout(() => v.textContent = "View only. Take over to control the phone.", 2500); }
</script>
</body>
</html>
